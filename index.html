<!doctype html>
<html lang="en">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- SEO Meta Tags -->
    <title>Sai Charan – Full-Stack Developer & Software Engineer Portfolio</title>
    <meta name="description" content="Sai Charan's portfolio showcasing full-stack development projects including LoanLens, AutoOps, Scango, and MediSense. Expert in React, Python, TypeScript, and cloud technologies." />
    <meta name="keywords" content="full-stack developer, React developer, Python developer, portfolio, software engineer, web development, TypeScript, Node.js, MongoDB" />
    <meta name="author" content="Sai Charan" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://saicharan.dev" />
    
    <!-- Open Graph Meta Tags (Social Media Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://saicharan.dev" />
    <meta property="og:title" content="Sai Charan – Full-Stack Developer & Software Engineer" />
    <meta property="og:description" content="Portfolio showcasing full-stack development projects and technical expertise in React, Python, TypeScript, and cloud technologies." />
    <meta property="og:image" content="https://saicharan.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sai Charan – Full-Stack Developer" />
    <meta name="twitter:description" content="Full-stack developer specializing in React, Python, TypeScript, and cloud technologies. Explore my portfolio." />
    <meta name="twitter:image" content="https://saicharan.dev/og-image.jpg" />
    
    <!-- Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sai Charan Portfolio" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Sai Charan",
      "url": "https://saicharan.dev",
      "image": "https://saicharan.dev/profile-image.jpg",
      "jobTitle": "Full-Stack Developer",
      "description": "Full-stack developer specializing in React, Python, TypeScript, and cloud technologies",
      "sameAs": [
        "https://linkedin.com/in/saicharan",
        "https://github.com/saicharan"
      ],
      "knowsAbout": ["React", "Python", "TypeScript", "Node.js", "MongoDB", "FastAPI", "AWS", "Git"],
      "worksFor": {
        "@type": "Organization",
        "name": "Self-employed"
      }
    }
    </script>
    
    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://saicharan.dev"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Projects",
          "item": "https://saicharan.dev#projects"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "About",
          "item": "https://saicharan.dev#about"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
